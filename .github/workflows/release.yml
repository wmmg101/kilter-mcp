name: release

# Publishes to PyPI via Trusted Publishing (OIDC). No API tokens are stored anywhere.
# Trigger: push a tag like v0.1.0 whose version matches pyproject.toml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match pyproject version $version" >&2
            exit 1
          fi
      - name: Test
        run: |
          uv sync --locked
          uv run ruff check .
          uv run pytest
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kilter-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-pushing an existing tag (e.g. after a history rewrite) is a no-op, not a failure.
          skip-existing: true
